<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Brushed-steel rim and lettering, matching the site's monogram. -->
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.38" stop-color="#a1a1aa"/>
      <stop offset="0.55" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#face)" stroke="url(#steel)" stroke-width="3"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="-1"
        fill="url(#steel)">PS</text>
</svg>
